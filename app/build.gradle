plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leakeye.mvp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.leakeye.mvp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        debug {
            // 로컬/CI 빌드가 항상 같은 키로 서명되도록 저장소에 고정 debug 키스토어를 커밋해 사용한다.
            // (기본 debug 서명은 머신마다 다른 ~/.android/debug.keystore를 써서, 다른 머신에서 빌드하면
            // 기존 설치본과 서명이 달라져 설치가 거부된다.)
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
