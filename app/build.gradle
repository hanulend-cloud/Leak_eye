plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leakeye.mvp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.leakeye.mvp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
